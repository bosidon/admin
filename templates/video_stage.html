{% extends "base.html" %}

{% block title %}视频制作 - 仙宝内容平台{% endblock %}
{% block page_title %}🎬 视频制作{% endblock %}

{% block topbar_right %}
<button class="btn btn-outline" onclick="load()">🔄 刷新</button>
{% endblock %}

{% block content %}
<div style="display:flex;gap:8px;margin-bottom:18px;">
    <button id="tab-script" class="btn btn-primary" onclick="switchTab('script')">✍️ 分镜脚本</button>
    <button id="tab-video" class="btn btn-outline" onclick="switchTab('video')">🎞️ 分镜视频</button>
</div>

<div class="card">
    <div id="tab-desc" style="font-size:13px;color:#64748b;margin-bottom:14px;"></div>
    <div id="list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
const PLATFORM_MAP = {wechat:'公众号', xiaohongshu:'小红书', video_account:'视频号', douyin:'抖音', bilibili:'B站', kuaishou:'快手', podcast:'播客', zhihu:'知乎', toutiao:'头条'};
const CTYPE_MAP = {article:'图文文章', short_video:'短视频脚本', long_video:'长视频脚本', speech:'口播稿'};
let CUR_TAB = 'script';
let ARTICLES = [];
let PLANS = [];

function switchTab(t) {
    CUR_TAB = t;
    document.getElementById('tab-script').className = 'btn ' + (t==='script' ? 'btn-primary' : 'btn-outline');
    document.getElementById('tab-video').className  = 'btn ' + (t==='video'  ? 'btn-primary' : 'btn-outline');
    document.getElementById('tab-desc').textContent = t==='script'
        ? '阶段 ③-1 —— 为「已审核」的短视频 / 长视频脚本生成分镜表（画面 / 台词 / 时长）'
        : '阶段 ③-2 —— 基于分镜生成素材、合成并导出视频';
    render();
}

function render() {
    const el = document.getElementById('list');
    if (CUR_TAB === 'script') {
        // 已审核的视频类文案（短视频 / 长视频脚本）
        const illustrated = ARTICLES.filter(a => {
            return a.status === 'approved' && ['short_video', 'long_video'].includes(a.content_type);
        });
        if (!illustrated.length) {
            el.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:44px;color:#94a3b8;">'
                + '📭 暂无「已审核」的短视频 / 长视频脚本 —— 请先到 <a href="/articles" style="color:#7c3aed;">✍️ 文案</a> 创建并审核</div>';
            return;
        }
        el.innerHTML = illustrated.map(a => {
            let imgs = [];
            try { imgs = JSON.parse(a.images_json || '[]'); } catch(e) { imgs = []; }
            const plan = PLANS.find(p => p.article_id === a.id);
            return `<div style="border:1px solid #e2e8f0;border-radius:12px;padding:16px;">
                <div style="font-weight:600;margin-bottom:8px;">${a.title || '未命名'}</div>
                <div style="font-size:12px;color:#64748b;margin-bottom:10px;">
                    ${PLATFORM_MAP[a.platform]||'-'} · ${CTYPE_MAP[a.content_type]||'-'} · ${imgs.length > 0 ? '🎨 ' + imgs.length + ' 张配图' : ''}
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <span style="font-size:12px;padding:3px 8px;border-radius:4px;${plan ? 'background:#d1fae5;color:#065f46;' : 'background:#f1f5f9;color:#64748b;'}">
                        ${plan ? '📝 已有脚本' : '⚪ 未生成'}
                    </span>
                    <button class="btn btn-primary btn-sm" onclick="openPlan(${a.id}, '${(a.title||'').replace(/'/g, '')}')">
                        ${plan ? '继续编辑' : '生成分镜脚本'}
                    </button>
                </div>
            </div>`;
        }).join('');
    } else {
        // 已有分镜的 → 素材/渲染
        const ready = PLANS.filter(p => p.status === 'storyboard_done' || p.status === 'rendering' || p.status === 'done');
        if (!ready.length) {
            el.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:44px;color:#94a3b8;">'
                + '📭 暂无已生成分镜的视频 —— 请先完成「分镜脚本」</div>';
            return;
        }
        el.innerHTML = ready.map(p => `<div style="border:1px solid #e2e8f0;border-radius:12px;padding:16px;">
            <div style="font-weight:600;margin-bottom:8px;">${p.article_title || p.title || '未命名'}</div>
            <div style="font-size:12px;color:#64748b;margin-bottom:10px;">状态：${p.status}</div>
            <button class="btn btn-outline btn-sm" onclick="openSetup(${p.id})">${p.persona_material_id ? '修改人物/声音' : '制作视频'}</button>
            <div style="font-size:12px;color:#0f766e;margin-top:8px;">🖼 ${p.persona_material_id ? '形象 #' + p.persona_material_id : '未选形象'} · 🎙 ${p.voice_material_id ? '声音 #' + p.voice_material_id : '未选声音'} · ${p.aspect || '9:16'} · ${p.duration_target || 15}s</div>
        </div>`).join('');
    }
}

async function openPlan(articleId, title) {
    const r = await api('/api/video-plans', {method:'POST', body: JSON.stringify({article_id: articleId, title: title})});
    if (r.ok) { location.href = '/video-plan/' + r.id; }
    else { toast('❌ ' + (r.error || '创建失败'), 'error'); }
}

async function load() {
    ARTICLES = await api('/api/articles');
    if (!Array.isArray(ARTICLES)) ARTICLES = [];
    PLANS = await api('/api/video-plans');
    if (!Array.isArray(PLANS)) PLANS = [];
    switchTab(CUR_TAB);
}

let SETUP_PLAN = null, PICK_TARGET = 'persona';
async function libItems(type) {
    const r = await api('/api/library?type=' + type);
    return Array.isArray(r) ? r : [];
}
async function openSetup(planId) {
    const p = PLANS.find(x => x.id === planId) || {};
    SETUP_PLAN = p;
    document.getElementById('setupTitle').textContent = (p.article_title || p.title || '未命名');
    document.getElementById('setupAspect').value = p.aspect || '9:16';
    document.getElementById('setupDuration').value = String(p.duration_target || 15);
    const pe = document.getElementById('setupPersona'), ve = document.getElementById('setupVoice');
    pe.dataset.mid = p.persona_material_id || '';
    ve.dataset.mid = p.voice_material_id || '';
    pe.textContent = p.persona_material_id ? ('已选素材 #' + p.persona_material_id) : '未选择';
    ve.textContent = p.voice_material_id ? ('已选素材 #' + p.voice_material_id) : '未选择';
    document.getElementById('setupModal').style.display = 'flex';
}
function closeSetup() { document.getElementById('setupModal').style.display = 'none'; }
async function pick(target, type) {
    PICK_TARGET = target;
    const items = await libItems(type);
    document.getElementById('pickTitle').textContent = (type === 'image' ? '选择人物形象（图片素材）' : '选择声音（音频素材）');
    document.getElementById('pickList').innerHTML = items.length ? items.map(m => `
      <div onclick="choosePick(${m.id})" style="display:flex;gap:10px;align-items:center;padding:8px;border:1px solid #e2e8f0;border-radius:10px;cursor:pointer;">
        ${type === 'image' ? `<img src="/api/materials/thumb?u=${encodeURIComponent(m.file_path || '')}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;background:#f1f5f9;">` : '<span style="font-size:24px;">🎵</span>'}
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${m.name || ('素材 #' + m.id)}</div>
          <div style="font-size:11px;color:#94a3b8;">#${m.id} · ${m.created_at || ''}</div>
        </div>
        ${type === 'audio' ? `<audio controls src="${m.file_path || ''}" style="height:30px;" onclick="event.stopPropagation()"></audio>` : ''}
      </div>`).join('') : '<div style="padding:24px;color:#94a3b8;text-align:center;">该类型暂无素材 —— 请先到「素材库」上传</div>';
    document.getElementById('pickModal').style.display = 'flex';
}
function closePick() { document.getElementById('pickModal').style.display = 'none'; }
function choosePick(id) {
    const el = document.getElementById(PICK_TARGET === 'persona' ? 'setupPersona' : 'setupVoice');
    el.dataset.mid = id; el.textContent = '已选素材 #' + id;
    closePick();
}
async function saveSetup() {
    const body = {
        persona_material_id: parseInt(document.getElementById('setupPersona').dataset.mid || '0', 10) || null,
        voice_material_id: parseInt(document.getElementById('setupVoice').dataset.mid || '0', 10) || null,
        aspect: document.getElementById('setupAspect').value,
        duration_target: parseInt(document.getElementById('setupDuration').value, 10) || 15
    };
    if (!body.persona_material_id) { return toast('请先选择人物形象', 'error'); }
    if (!body.voice_material_id) { return toast('请先选择声音', 'error'); }
    const r = await api('/api/video-plans/' + SETUP_PLAN.id, {method: 'PUT', body: JSON.stringify(body)});
    if (r && r.ok) { toast('已保存 ✓'); closeSetup(); await load(); }
    else { toast('❌ ' + ((r && r.error) || '保存失败'), 'error'); }
}
load();
</script>

<div id="setupModal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:14px;padding:20px;width:430px;max-width:92vw;">
    <div style="font-weight:600;margin-bottom:4px;">制作视频</div>
    <div id="setupTitle" style="font-size:12px;color:#64748b;margin-bottom:12px;"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #f1f5f9;">
      <span>🖼 人物形象</span><button id="setupPersona" class="btn btn-outline btn-sm" data-mid="" onclick="pick('persona','image')">未选择</button></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #f1f5f9;">
      <span>🎙 声音</span><button id="setupVoice" class="btn btn-outline btn-sm" data-mid="" onclick="pick('voice','audio')">未选择</button></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #f1f5f9;">
      <span>📐 画幅</span><select id="setupAspect" style="padding:6px 10px;border:1px solid #e2e8f0;border-radius:8px;"><option value="9:16">9:16 竖版</option><option value="16:9">16:9 横版</option></select></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #f1f5f9;">
      <span>⏱ 目标时长</span><select id="setupDuration" style="padding:6px 10px;border:1px solid #e2e8f0;border-radius:8px;"><option value="15">15 秒</option><option value="30">30 秒</option><option value="45">45 秒</option><option value="60">60 秒</option></select></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-outline btn-sm" onclick="closeSetup()">取消</button><button class="btn btn-sm" onclick="saveSetup()">保存</button></div>
  </div>
</div>
<div id="pickModal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:14px;padding:18px;width:470px;max-width:92vw;max-height:76vh;display:flex;flex-direction:column;">
    <div id="pickTitle" style="font-weight:600;margin-bottom:10px;">选择素材</div>
    <div id="pickList" style="overflow:auto;display:grid;gap:8px;"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:12px;"><button class="btn btn-outline btn-sm" onclick="closePick()">关闭</button></div>
  </div>
</div>

{% endblock %}
