{% extends "base.html" %}
{% block title %}仪表盘 - 视频创作平台{% endblock %}
{% block page_title %}📊 仪表盘{% endblock %}
{% block topbar_right %}
<a href="/project/new" class="btn btn-primary">✨ 新建项目</a>
{% endblock %}

{% block content %}
<div class="stats" id="stats">
    <div class="stat"><h3 id="s-total">-</h3><p>总项目</p></div>
    <div class="stat"><h3 id="s-progress">-</h3><p>进行中</p></div>
    <div class="stat"><h3 id="s-done">-</h3><p>已完成</p></div>
    <div class="stat"><h3 id="s-published">-</h3><p>已发布</p></div>
</div>

<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3>📁 最近项目</h3>
        <a href="/project/new" class="btn btn-outline btn-sm">查看全部</a>
    </div>
    <div class="project-grid" id="project-list"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function load() {
    const projects = await api('/api/projects');
    
    // 统计
    const total = projects.length;
    const progress = projects.filter(p => !['render_done', 'published'].includes(p.status)).length;
    const done = projects.filter(p => ['render_done'].includes(p.status)).length;
    const published = projects.filter(p => p.status === 'published').length;
    
    document.getElementById('s-total').textContent = total;
    document.getElementById('s-progress').textContent = progress;
    document.getElementById('s-done').textContent = done;
    document.getElementById('s-published').textContent = published;
    
    // 项目列表
    const el = document.getElementById('project-list');
    if (projects.length === 0) {
        el.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;grid-column:1/-1;">暂无项目，点击「新建项目」开始</div>';
        return;
    }
    
    el.innerHTML = projects.slice(0, 8).map(p => {
        // 计算进度
        const stages = ['draft', 'scripting', 'script_done', 'storyboard', 'storyboard_done', 'asset_production', 'asset_done', 'rendering', 'render_done'];
        const idx = stages.indexOf(p.status);
        const progress = idx >= 0 ? Math.round((idx / (stages.length - 1)) * 100) : 0;
        
        return `
        <div class="project-card" onclick="location.href='/project/${p.uuid}'">
            <h3>${p.title || '未命名项目'}</h3>
            <div class="meta">
                <span>${platformLabel(p.platform)}</span>
                <span>${videoTypeLabel(p.video_type)}</span>
                <span>${styleLabel(p.style)}</span>
            </div>
            <div class="progress">
                <div class="progress-bar" style="width:${progress}%"></div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
                <span class="tag ${statusClass(p.status)}">${statusLabel(p.status)}</span>
                <span style="font-size:12px;color:#64748b;">${formatDate(p.updated_at || p.created_at)}</span>
            </div>
        </div>`;
    }).join('');
}

load();
</script>
{% endblock %}
