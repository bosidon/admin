{% extends "base.html" %}

{% block title %}分镜脚本 - 仙宝内容平台{% endblock %}
{% block page_title %}✍️ 分镜脚本{% endblock %}

{% block topbar_right %}
<button class="btn btn-success" onclick="saveAll()">💾 保存</button>
<button class="btn btn-outline" onclick="location.href='/video'">← 返回</button>
{% endblock %}

{% block content %}
<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 id="plan-title">加载中…</h3>
        <span id="plan-status" class="tag"></span>
    </div>

    <!-- 原始文案（参考） -->
    <details style="margin-bottom:18px;">
        <summary style="cursor:pointer;font-size:13px;color:#64748b;">📄 查看原始文案</summary>
        <div id="src-content" style="margin-top:10px;padding:14px;background:#f8fafc;border-radius:8px;font-size:13px;line-height:1.8;white-space:pre-wrap;max-height:300px;overflow:auto;"></div>
    </details>

    <!-- 3 个独立 Tab：剧本 / 素材 / 分镜（只做显示/隐藏；现有块仅加 id+class，不复制不重写） -->
    <style>
      .plan-tabs{display:flex;gap:6px;border-bottom:2px solid #e2e8f0;margin-bottom:18px;}
      .plan-tab{padding:8px 18px;border:none;background:transparent;font-size:14px;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit;}
      .plan-tab.active{color:#6d28d9;font-weight:600;border-bottom-color:#6d28d9;}
      .tab-pane{display:none;}
      .tab-pane.active{display:block;}
    </style>
    <div class="plan-tabs">
        <button class="plan-tab active" id="ptab-script" onclick="switchTab('script')">📝 剧本</button>
        <button class="plan-tab" id="ptab-assets" onclick="switchTab('assets')">🎨 素材</button>
        <button class="plan-tab" id="ptab-shots" onclick="switchTab('shots')">🎬 分镜</button>
    </div>

    <!-- Tab 剧本：① 视频脚本（上方表单直接编辑：人物/场景/道具/分节，无 JSON 框） -->
    <div id="blk-script" class="tab-pane active" style="margin-bottom:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <label style="font-weight:600;font-size:14px;">① 剧本（人物 / 场景 / 道具 / 分节）</label>
            <div>
                <button class="btn btn-primary btn-sm" id="gen-script-btn" onclick="genScript()">🤖 AI 生成剧本</button>
                <button class="btn btn-outline btn-sm" id="save-script-btn" onclick="saveScript()">💾 保存剧本</button>
            </div>
        </div>
        <div id="script-view" style="margin-bottom:10px;padding:14px;background:#f8fafc;border-radius:8px;font-size:13px;line-height:1.8;"></div>
    </div>

    <!-- Tab 素材：素材列表（剧本需要的素材） -->
        <!-- Tab 分镜：② 分镜表 -->
    <div id="blk-shots" class="tab-pane">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <label style="font-weight:600;font-size:14px;">② 分镜表（画面 / 台词 / 时长）</label>
            <div>
                <select id="clip-engine" onchange="setClipEngine(this.value)" title="片段引擎：H3 参考＝用该镜素材图（最多 5 张），带音轨 —— 只走 6000D（¥6.46/h），约 3 分钟/条" style="height:30px;font-size:12px;border:1px solid #cbd5e1;border-radius:6px;padding:0 6px;">
                    <option value="h3ref">片段 · H3 参考5图</option>
                </select>
                <button class="btn btn-outline btn-sm" onclick="genClipAll()">🎬 整片出片段</button>
                <button class="btn btn-primary btn-sm" onclick="genStoryboard()">🤖 AI 生成分镜</button>
                <button class="btn btn-outline btn-sm" onclick="addScene()">＋ 添加镜头</button>
            </div>
        </div>
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead>
                <tr style="background:#f8fafc;">
                    <th style="padding:8px;border:1px solid #e2e8f0;width:50px;">镜号</th>
                    <th style="padding:8px;border:1px solid #e2e8f0;">画面</th>
                    <th style="padding:8px;border:1px solid #e2e8f0;">台词/字幕</th>
                    <th style="padding:8px;border:1px solid #e2e8f0;">素材</th>
                    <th style="padding:8px;border:1px solid #e2e8f0;width:146px;">片段</th>
                    <th style="padding:8px;border:1px solid #e2e8f0;width:90px;">时长(秒)</th>
                    <th style="padding:8px;border:1px solid #e2e8f0;width:50px;">操作</th>
                </tr>
            </thead>
            <tbody id="sb-body"></tbody>
        </table>
    </div>

    <!-- Tab 素材：③ 素材需求（asset_requirements / asset_prompts） -->
    <div id="blk-reqs" class="tab-pane" style="margin-top:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;">
            <label style="font-weight:600;font-size:14px;">素材列表（列出剧本需要的素材）</label>
            <div style="display:flex;gap:6px;align-items:center;">
                <span id="asset-sel-count" style="color:#64748b;font-size:12px;"></span>
                <button class="btn btn-outline btn-sm" onclick="toggleSelectAll()">☑ 全选待生成</button>
                <button class="btn btn-primary btn-sm" id="asset-batch-btn" onclick="genAssetsBatch()">🎨 批量生成所选</button>
                <button class="btn btn-outline btn-sm" id="asset-gen-btn" onclick="genAssets()">🧩 生成素材需求</button>
            </div>
        </div>
        <div id="asset-req"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const PLAN_ID = {{ plan_id }};
const PLAN_ARTICLE_ID = {{ article_id or 0 }};    // 素材归属：AI 生成素材挂到本文案名下
let PLAN = null;
let SCENES = [];
// ===== 素材包 / 素材需求 =====
const KIND_CN = { persona: '人物', scene: '场景', prop: '道具' };
const ROLE_KINDS = ['persona', 'scene', 'prop'];
let ROLES = { persona: [], scene: [], prop: [] };
let ROLE_IDS = [];
let REQS = [];
let PROMPTS = [];
let PROMPT_FLAT = [];
let SCRIPT_OBJ = null;

// ==================== 3 个独立 Tab（剧本 / 素材 / 分镜；只切换显示，不动块内容） ====================
const TAB_PANES = { script: ['blk-script'], assets: ['blk-reqs'], shots: ['blk-shots'] };
function switchTab(name) {
    Object.keys(TAB_PANES).forEach(function (k) {
        const on = (k === name);
        const btn = document.getElementById('ptab-' + k);
        if (btn) { if (on) { btn.classList.add('active'); } else { btn.classList.remove('active'); } }
        TAB_PANES[k].forEach(function (id) {
            const el = document.getElementById(id);
            if (el) { if (on) { el.classList.add('active'); } else { el.classList.remove('active'); } }
        });
    });
}

function renderScenes() {
    const tb = document.getElementById('sb-body');
    if (!SCENES.length) {
        tb.innerHTML = '<tr><td colspan="7" style="padding:24px;text-align:center;color:#94a3b8;">暂无分镜，点击「AI 生成分镜」或「添加镜头」开始</td></tr>';
        return;
    }
    tb.innerHTML = SCENES.map((s, i) => `<tr>
        <td style="padding:6px;border:1px solid #e2e8f0;text-align:center;">${i+1}</td>
        <td style="padding:6px;border:1px solid #e2e8f0;"><textarea rows="2" data-i="${i}" data-f="visual" style="width:100%;border:none;font-size:12px;resize:vertical;font-family:inherit;">${s.visual||''}</textarea></td>
        <td style="padding:6px;border:1px solid #e2e8f0;"><textarea rows="2" data-i="${i}" data-f="line" style="width:100%;border:none;font-size:12px;resize:vertical;font-family:inherit;">${s.line||''}</textarea></td>
        <td style="padding:6px;border:1px solid #e2e8f0;">${assetCell(s)}</td>
        <td style="padding:6px;border:1px solid #e2e8f0;">${clipCell(i)}</td>
        <td style="padding:6px;border:1px solid #e2e8f0;text-align:center;"><input type="number" value="${s.duration||5}" data-i="${i}" data-f="duration" style="width:60px;border:none;text-align:center;font-size:12px;"></td>
        <td style="padding:6px;border:1px solid #e2e8f0;text-align:center;"><button class="btn btn-danger btn-sm" onclick="delScene(${i})">✕</button></td>
    </tr>`).join('');
    tb.querySelectorAll('textarea,input').forEach(el => {
        el.onchange = function() {
            const i = +this.dataset.i, f = this.dataset.f;
            SCENES[i][f] = (f === 'duration') ? (+this.value || 5) : this.value;
        };
    });
}



// ==================== 分镜片段（该镜素材图 → 一条 mp4） ====================
let CLIPS = {};                          // 镜号 → {clip_url, clip_engine, clip_duration_s, has_start, has_end}
let CLIP_ENGINE = 'h3ref'; localStorage.setItem('clip_engine', 'h3ref');
function setClipEngine(v) {
    CLIP_ENGINE = 'h3ref';
    localStorage.setItem('clip_engine', CLIP_ENGINE);
    if (CLIP_ENGINE === 'h3ref') { toast('H3 多图参考：用该镜素材图（最多 5 张），带音轨 —— 只走 6000D（¥6.46/h），约 3 分钟/条'); }
}
function applyClipEngine() { const s = document.getElementById('clip-engine'); if (s) { s.value = CLIP_ENGINE; } }
async function loadClips() {
    try {
        const d = await api('/api/video-plans/' + PLAN_ID + '/shot-clip', { method: 'GET' });
        CLIPS = {};
        (d.shots || []).forEach(s => { CLIPS[s.shot_idx] = s; });
    } catch (e) { CLIPS = {}; }
}
function clipCell(i) {
    const c = CLIPS[i] || {};
    const url = c.clip_url || '';
    const box = url
        ? '<video src="' + url + '" controls preload="metadata" style="width:100%;max-height:74px;border-radius:6px;background:#000;display:block;"></video>'
        : '<div style="height:64px;display:flex;align-items:center;justify-content:center;background:#f8fafc;border-radius:6px;color:#cbd5e1;font-size:11px;">未生成</div>';
    const eng = url ? ('<span style="color:#64748b;font-size:10px;">' + ((c.clip_engine || 'wan') === 'h3ref' ? 'H3参考' : ((c.clip_engine || 'wan') === 'h3' ? 'H3' : 'Wan')) + '</span>') : '';
    const dur = c.clip_duration_s ? ('<span style="color:#0f766e;font-size:11px;">' + c.clip_duration_s + 's</span>') : '';
    const tag = (eng || dur) ? ('<div style="display:flex;gap:6px;align-items:center;justify-content:flex-end;">' + eng + dur + '</div>') : '';
    return '<div style="display:flex;flex-direction:column;gap:4px;">' + box
        + '<div style="display:flex;gap:4px;align-items:center;">'
        + '<button class="btn btn-outline btn-sm" style="flex:1;padding:2px 6px;font-size:11px;" onclick="genClip(' + i + ')">' + (url ? '重出片段' : '🎬 出片段') + '</button>'
        + '</div>' + tag + '</div>';
}
async function genClip(i) {
    const r = await api('/api/video-plans/' + PLAN_ID + '/shot-clip', {
        method: 'POST', body: JSON.stringify({ shot_idx: i, engine: CLIP_ENGINE }) });
    if (r && r.ok) { toast('已排队：第 ' + (i + 1) + ' 镜 · 片段（队列 ' + (r.queue_pos || 0) + '）—— 出视频较慢，去「任务」页看进度'); }
    else { toast('❌ ' + ((r && r.error) || '入队失败'), 'error'); }
}
async function genClipAll() {
    if (!SCENES.length) { toast('还没有分镜', 'error'); return; }
    const r = await api('/api/video-plans/' + PLAN_ID + '/shot-clip', {
        method: 'POST', body: JSON.stringify({ engine: CLIP_ENGINE }) });
    if (r && r.ok) { toast('已排队 ' + r.targets + ' 条片段（' + (r.job_ids ? r.job_ids.length : r.targets) + ' 个任务）—— 去「任务」页看进度'); }
    else { toast('❌ ' + ((r && r.error) || '入队失败'), 'error'); }
}
async function refreshClips() { await loadClips(); renderScenes(); }
applyClipEngine();

function addScene() { SCENES.push({visual:'', line:'', duration:5}); renderScenes(); }
function delScene(i) { SCENES.splice(i,1); renderScenes(); }

// ==================== 素材包（role_ids） ====================
function roleById(id) {
    for (const k of ROLE_KINDS) {
        const r = (ROLES[k] || []).find(x => x.id === id);
        if (r) return r;
    }
    return null;
}

function assetCell(s) {
    const items = [];
    (s.characters || []).forEach(c => items.push(['persona', c]));
    if (s.scene) items.push(['scene', s.scene]);
    (s.props || []).forEach(p => items.push(['prop', p]));
    if (!items.length) return '<span style="color:#cbd5e1;">—</span>';
    return items.map(function (it) {
        const k = it[0], n = it[1];
        const hit = (ROLES[k] || []).some(r => r.name === n);
        return '<div style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'
            + (hit ? 'color:#0f766e;' : 'color:#d97706;') + '" title="' + n + '">'
            + (hit ? '' : '⚠️ ') + n + '</div>';
    }).join('');
}

function renderRolePack() { try { renderReqs(); } catch (e) {} }

async function loadRoles() {
    const all = await api('/api/roles', { method: 'GET' });
    const arr = Array.isArray(all) ? all : [];
    ROLES = { persona: [], scene: [], prop: [] };
    arr.forEach(r => { (ROLES[r.kind] = ROLES[r.kind] || []).push(r); });
}

async function pickRole(kind) {
    const list = await api('/api/roles?kind=' + kind, { method: 'GET' });
    ROLES[kind] = Array.isArray(list) ? list : [];
    const body = ROLES[kind].length ? ROLES[kind].map(function (r) {
        return '<div onclick="chooseRole(' + r.id + ')" style="display:flex;gap:10px;align-items:center;padding:8px;border:1px solid #e2e8f0;border-radius:10px;cursor:pointer;margin-bottom:6px;">'
            + (r.front && r.front.file_path ? '<img src="/api/materials/thumb?u=' + encodeURIComponent(r.front.file_path) + '" style="width:44px;height:44px;object-fit:cover;border-radius:8px;">' : '<span style="font-size:22px;">🖼</span>')
            + '<div style="flex:1;min-width:0;"><div style="font-size:13px;">' + (r.name || ('#' + r.id)) + '</div>'
            + '<div style="font-size:11px;color:#94a3b8;">' + (r.note || '') + '</div></div>'
            + '</div>';
    }).join('') : '<div style="padding:24px;color:#94a3b8;text-align:center;">该类型暂无角色 —— 请到「素材库」新建</div>';
    openModal('从库选' + (KIND_CN[kind] || ''), body, function () {});
}

function chooseRole(id) {
    if (ROLE_IDS.indexOf(id) < 0) ROLE_IDS.push(id);
    closeModal();
    renderRolePack();
}

function removeRole(id) {
    ROLE_IDS = ROLE_IDS.filter(x => x !== id);
    renderRolePack();
}

async function saveRoleIds() {
    const r = await api('/api/video-plans/' + PLAN_ID, {
        method: 'PUT', body: JSON.stringify({ role_ids: JSON.stringify(ROLE_IDS) })
    });
    if (r && r.ok) { toast('已加入本片素材 ✓'); }
    else { toast('❌ ' + ((r && r.error) || '保存失败'), 'error'); }
    return r;
}

// ==================== 素材需求（asset_requirements / asset_prompts） ====================
function renderReqs() {
    const box = document.getElementById('asset-req');
    if (!box) return;
    PROMPT_FLAT = [];
    if (!REQS.length) {
        box.innerHTML = '<div style="padding:16px;color:#94a3b8;font-size:12px;">生成分镜后在此显示素材需求</div>';
        return;
    }
    const USED = [];
    REQ_PROMPT_IDX = {};                    // 需求行 id → 该行的提词下标（批量生成用）
    box.innerHTML = REQS.map(function (q, qi) {
        const exists = !!q.exists;
        const attached = !!q.material_id;
        const rid = String((q.id === undefined || q.id === null) ? ('x' + qi) : q.id);
        const pm = PROMPTS.filter(p => (p.kind || '') === (q.kind || '') && p.name === q.name
                                       && (!q.slot || !p.slot || p.slot === q.slot));
        pm.forEach(p => { if (USED.indexOf(p) < 0) USED.push(p); });
        const idxs = pm.map(function (p) { return PROMPT_OBJ.push(p) - 1; });
        REQ_PROMPT_IDX[rid] = idxs;
        const btns = pm.map(function (p, k) { return promptHtml(p, idxs[k]); }).join('');
        const img = attached ? ('<img src="/api/materials/thumb?u=' + encodeURIComponent(q.material_url || '') + '" '
            + 'style="width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid #e2e8f0;">') : '';
        const ck = '<input type="checkbox" class="ar-ck" data-rid="' + rid + '"' + (SEL_REQ.has(rid) ? ' checked' : '')
            + ' onclick="onReqCheck(this)" style="margin-right:6px;vertical-align:-2px;">';
        return '<div style="border:1px solid ' + (attached ? '#99f6e4' : (exists ? '#e2e8f0' : '#fcd34d'))
            + ';background:' + (attached ? '#f0fdfa' : (exists ? '#fff' : '#fffbeb'))
            + ';border-radius:10px;padding:10px;margin-bottom:8px;display:flex;gap:10px;">'
            + img
            + '<div style="flex:1;min-width:0;">'
            + '<div style="font-size:13px;">' + ck + '<b>' + (KIND_CN[q.kind] || q.kind || '') + ' · ' + (q.name || '')
            + (q.slot ? ' · ' + q.slot : '') + '</b> '
            + (attached ? '<span style="color:#0f766e;font-size:11px;">✔ 已关联素材'
                        + (q.source ? '（' + (q.source === 'ai' ? 'AI 生成' : '素材库') + '）' : '') + '</span>'
                        : (exists ? '<span style="color:#0f766e;font-size:11px;">✔ 库里已有' + (q.matched_role_name ? '：' + q.matched_role_name : '') + '</span>'
                                  : '<span style="color:#d97706;font-size:11px;">⚠️ 缺，需出图</span>'))
            + ((q.matched_role_id && ROLE_IDS.indexOf(q.matched_role_id) >= 0) ? ' <span style="color:#0f766e;font-size:11px;">✓ 已进本片</span>' : '')
        + ' <button class="btn btn-outline btn-sm" onclick="pickMaterialFor(\'' + rid + '\')">📚 从素材库选</button>'
        + ' <button class="btn btn-primary btn-sm" onclick="genAssetByIdx(' + (idxs[0] !== undefined ? idxs[0] : -1) + ')">🎨 AI 生成</button>'
        + ' <span id="as-st-' + (idxs[0] !== undefined ? idxs[0] : -1) + '" style="color:#64748b;font-size:11px;"></span>'
        + (q.matched_role_id ? ' <button class="btn btn-outline btn-sm" onclick="useRoleOnce(' + q.matched_role_id + ')">用库里的</button>' : '')
            + '<span style="color:#94a3b8;font-size:11px;"> · 出现在镜头 '
            + (((q.needed_in_shots || []).map(n => (+n) + 1).join(', ')) || '-') + '</span></div>'
            + btns + '</div></div>';
    }).join('');
    updateSelCount();
    // LLM 可能给 req 与 prompt 用不同名字：未匹配上的提词单独列出，避免被吞掉
    const rest = PROMPTS.filter(p => USED.indexOf(p) < 0);
    if (rest.length) {
        box.innerHTML += '<div style="border:1px dashed #cbd5e1;border-radius:10px;padding:10px;margin-bottom:8px;">'
            + '<div style="font-size:12px;font-weight:600;color:#475569;">其他出图提词（未按名称匹配到具体需求）</div>'
            + rest.map(promptHtml).join('') + '</div>';
    }
}

function promptHtml(p, _objIdx) {
    const i1 = PROMPT_FLAT.push(p.prompt || '') - 1;
    const i2 = PROMPT_FLAT.push(p.prompt_en || '') - 1;
    return '<div style="margin-top:6px;background:#f8fafc;border-radius:8px;padding:8px;font-size:12px;">'
        + '<div><b>中文提词</b>：' + (p.prompt || '') + ' <button class="btn btn-outline btn-sm" onclick="copyIdx(' + i1 + ')">复制</button></div>'
        + '<div style="margin-top:4px;color:#475569;"><b>EN</b>：' + (p.prompt_en || '') + ' <button class="btn btn-outline btn-sm" onclick="copyIdx(' + i2 + ')">复制</button></div>'
        + '<div style="margin-top:4px;color:#94a3b8;">' + (KIND_CN[p.kind] || p.kind || '') + ' · ' + (p.name || '') + ' · aspect ' + (p.aspect || '-') + ' · slot ' + (p.slot || '-')  + '</div>'
        + '</div>';
}

const PROMPT_OBJ = [];
const SEL_REQ = new Set();          // 勾选的需求行 id（批量生成用）
let REQ_PROMPT_IDX = {};            // 需求行 id → 提词对象下标数组
let LIB_PICK = [];                  // 素材库选择器当前列表（onclick 用下标查表，避免引号嵌套）

function onReqCheck(el) {
    const rid = el.dataset.rid;
    if (el.checked) { SEL_REQ.add(rid); } else { SEL_REQ.delete(rid); }
    updateSelCount();
}
function updateSelCount() {
    const el = document.getElementById('asset-sel-count');
    if (el) { el.textContent = SEL_REQ.size ? ('已选 ' + SEL_REQ.size + ' 项') : ''; }
}
function toggleSelectAll() {
    const all = REQS.map(function (q, i) { return String((q.id === undefined || q.id === null) ? ('x' + i) : q.id); });
    const wantAll = SEL_REQ.size < all.length;
    SEL_REQ.clear();
    if (wantAll) { all.forEach(id => SEL_REQ.add(id)); }
    document.querySelectorAll('.ar-ck').forEach(function (ck) { ck.checked = wantAll; });
    updateSelCount();
}

// ① 多选 → 批量 AI 生成（并发上限 2，避免一次压满 GPU 队列）
async function genAssetsBatch() {
    const ids = Array.from(SEL_REQ);
    if (!ids.length) { toast('先勾选要生成的素材', 'error'); return; }
    const idxs = [];
    ids.forEach(function (rid) { (REQ_PROMPT_IDX[rid] || []).forEach(i => idxs.push(i)); });
    if (!idxs.length) { toast('所选素材没有可用提词', 'error'); return; }
    const btn = document.getElementById('asset-batch-btn');
    const _t = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = '🎨 提交 ' + idxs.length + ' 个…'; }
    toast('已提交 ' + idxs.length + ' 个生成任务（队列处理，可关闭页面）');
    let _cur = 0;
    const _run = async function () {
        while (_cur < idxs.length) {
            const i = idxs[_cur++];
            try { genAssetByIdx(i); } catch (e) {}
            await new Promise(r => setTimeout(r, 400));      // 逐个提交，失败不互相影响
        }
    };
    await Promise.all([_run(), _run()]);
    if (btn) { btn.disabled = false; btn.textContent = _t; }
    SEL_REQ.clear();
    updateSelCount();
}

async function attachMaterial(rid, k) {

function genAssetByIdx(i) {
    const p = PROMPT_OBJ[i];
    const st = document.getElementById('as-st-' + i);
    if (!p) { return; }
    const kind = p.kind || 'persona';
    const prompt = (p.prompt_en || p.prompt || '').trim();
    if (!prompt) { if (st) { st.textContent = '这条没有提词'; } return; }
    const aspect = p.aspect || (kind === 'persona' ? '3:4' : (kind === 'scene' ? '16:9' : '1:1'));
    if (st) { st.textContent = '提交中…'; }
    fetch('/api/illustrate/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: prompt, aspect: aspect, style: '', article_id: PLAN_ARTICLE_ID || 0,
            attach: { plan_id: PLAN_ID, req_key: p.req_key || '', kind: kind, name: p.name || '', slot: p.slot || 'front' } }) })
      .then(r => r.json()).then(j => {
        if (!j.ok) { if (st) { st.textContent = '失败：' + (j.error || ''); } return; }
        if (st) { st.textContent = '已排队…'; }
        pollAssetJob(j.job_id, i, p, kind);
      }).catch(function () { if (st) { st.textContent = '提交失败'; } });
}
function pollAssetJob(jobId, i, p, kind) {
    const st = document.getElementById('as-st-' + i);
    let n = 0;
    const t = setInterval(function () {
        n++;
        fetch('/api/illustrate/job/' + jobId).then(r => r.json()).then(j => {
            const s2 = String(j.status || '').toLowerCase();
            if (['done', 'success', 'finished', 'completed'].indexOf(s2) >= 0) {
                clearInterval(t);
                const url = (Array.isArray(j.images) && j.images[0]) || j.result_url || j.url || (j.result && (j.result.url || j.result.image || j.result.file)) || '';
                if (st) { st.textContent = '已出图，挂载中…'; }
                fetch('/api/video-plans/' + PLAN_ID + '/asset-attach', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ kind: kind, name: p.name || '', slot: p.slot || 'front', req_key: p.req_key || '', url: url, material_id: j.material_id || null }) })
                  .then(r => r.json()).then(k => {
                    if (st) { st.textContent = k.ok ? (((k.req_attached) ? '✓ 已生成·需求行已挂「' : '✓ 已生成·已入库（需求行未匹配，可从素材库选）「') + (p.name || '') + '」') : ('挂载失败：' + (k.error || '')); }
                    if (k.ok) { load(); }
                  }).catch(function () { if (st) { st.textContent = '挂载请求失败'; } });
            } else if (['failed', 'error', 'canceled', 'cancelled'].indexOf(s2) >= 0) {
                clearInterval(t);
                if (st) { st.textContent = '失败：' + (j.error || ''); }
            } else {
                if (st) { st.textContent = '生成中…' + (n * 3) + 's'; }
                if (n > 200) { clearInterval(t); if (st) { st.textContent = '超时（稍后刷新可看结果）'; } }
            }
        }).catch(function () {});
    }, 3000);
}

function copyIdx(i) { copyText(PROMPT_FLAT[i] || ''); }

function copyText(t) {
    try {
        if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t); }
        else { throw new Error('no clipboard'); }
    } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = t;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e2) {}
        document.body.removeChild(ta);
    }
    toast('已复制 ✓');
}

async function load() {
    const d = await api('/api/video-plans/' + PLAN_ID, {method:'GET'});

    renderScript(SCRIPT_OBJ);

    if (!Array.isArray(SCENES)) SCENES = [];
    // 后端落库的是 LLM 原始镜头（visual_prompt/subtitle），页面用 visual/line → 兼容两种键名
    SCENES = SCENES.map(function (s) {

                 duration: s.duration || s.duration_s || 5, shot_type: s.shot_type || '',
                 characters: s.characters || [], scene: s.scene || '', props: s.props || [],
                 shot_face: s.shot_face || '', music_hint: s.music_hint || '',
                 template_hint: s.template_hint || 'U02' };
    });

    if (!Array.isArray(ROLE_IDS)) ROLE_IDS = [];
    // 素材需求（持久化字段）：详情接口返回已解析的数组，刷新后仍能渲染
    REQS = Array.isArray(d.asset_requirements) ? d.asset_requirements : [];
    PROMPTS = Array.isArray(d.asset_prompts) ? d.asset_prompts : [];
    await loadRoles();
    renderRolePack();
    renderReqs();
    await loadClips();
    renderScenes();
    // 加载原始文案
    const arts = await api('/api/articles');
    const art = (arts || []).find(a => a.id === d.article_id);

}

// 合计秒数 vs 剧本自报总时长 total_duration_s（红字提示，不拦截保存）
function updateSum() {
    let s = 0;
    document.querySelectorAll('.js-sf[data-f="seconds"]').forEach(function (n) {
        const v = parseInt(n.value, 10);
        if (!isNaN(v)) { s += v; }
    });
    const el = document.getElementById('sum-sec');
    if (el) { el.textContent = s; }
    const w = document.getElementById('sum-warn');
    const declared = (typeof SCRIPT_OBJ !== 'undefined' && SCRIPT_OBJ && SCRIPT_OBJ.total_duration_s) ? parseInt(SCRIPT_OBJ.total_duration_s, 10) : 0;
    if (w && declared) {
        if (s !== declared) {
            w.style.display = 'block';
            w.textContent = '⚠ 分节合计 ' + s + ' 秒 ≠ 剧本自报 ' + declared + ' 秒（差 ' + (s > declared ? '+' : '') + (s - declared) + '）';
        } else {
            w.style.display = 'none';
            w.textContent = '';
        }
    }
}

function addRow(key) {
    const o = collectForm();
    if (!Array.isArray(o[key])) { o[key] = []; }
    if (key === 'beats') { o[key].push({ seconds: 5, speaker: '旁白', line: '', visual: '', mood: '' }); }
    else if (key === 'characters') { o[key].push({ name: '', desc: '', speaks: true }); }
    else { o[key].push({ name: '', desc: '' }); }
    renderScript(o);
}

function delRow(key, i) {
    const o = collectForm();
    if (Array.isArray(o[key])) { o[key].splice(i, 1); }
    renderScript(o);
}

// 表单 -> 剧本对象（DOM = 唯一草稿；未保存的改动都在 DOM 里）
function collectForm() {
    const base = (SCRIPT_OBJ && typeof SCRIPT_OBJ === 'object') ? SCRIPT_OBJ : {};
    const o = Object.assign({}, base);
    const g = function (f) {
        const el = document.querySelector('.js-sf[data-f="' + f + '"]');
        return el ? el.value : '';
    };
    o.title = (g('title') || '').trim();
    o.logline = (g('logline') || '').trim();
    ['characters', 'scenes', 'props', 'beats'].forEach(function (k) {
        const src = Array.isArray(base[k]) ? base[k] : [];
        const groups = {};
        document.querySelectorAll('.js-sf[data-list="' + k + '"]').forEach(function (n) {
            const i = n.getAttribute('data-i');
            if (!groups[i]) { groups[i] = []; }
            groups[i].push(n);
        });
        o[k] = Object.keys(groups).map(Number).sort(function (a, b) { return a - b; }).map(function (i) {
            const row = Object.assign({}, src[i] || {});
            groups[i].forEach(function (n) {
                const f = n.getAttribute('data-f');
                if (n.type === 'checkbox') { row[f] = n.checked; }
                else if (f === 'seconds') { row[f] = (n.value === '') ? '' : parseInt(n.value, 10); }
                else { row[f] = n.value; }
            });
            return row;
        });
    });
    let sum = 0;
    (o.beats || []).forEach(function (b) { if (typeof b.seconds === 'number') { sum += b.seconds; } });
    o.total_duration_s = sum;
    return o;
}

    } catch (e) { r = { error: String(e) }; }
    if (btn) { btn.disabled = false; }
    if (!r || !r.ok || !r.script) {
        toast('❌ ' + ((r && r.error) || '生成失败'), 'error');
        document.getElementById('plan-status').textContent = (PLAN.status || '');
        return;
    }
    SCRIPT_OBJ = r.script;
    renderScript(SCRIPT_OBJ);
    await load();                                        // 回读服务端，确认落库 + 状态同步
    toast('✅ 剧本已生成并保存（' + ((SCRIPT_OBJ.beats || []).length) + ' 个分节）', 'success');
}

async function saveScript() {
    const o = collectForm();
    const errs = [];
    if (!o.title) { errs.push('标题必填'); }
    const names = ['旁白'].concat((o.characters || []).map(function (c) { return (c && c.name) || ''; }).filter(Boolean));
    [['characters', '人物'], ['scenes', '场景'], ['props', '道具']].forEach(function (pair) {
        (o[pair[0]] || []).forEach(function (x, i) {
            if (!String((x && x.name) || '').trim()) { errs.push(pair[1] + '第 ' + (i + 1) + ' 行名称为空'); }
        });
    });
    (o.beats || []).forEach(function (b, i) {
        const n = i + 1;
        if (!String((b && b.line) || '').trim()) { errs.push('第 ' + n + ' 节台词为空'); }
        const sec = b ? b.seconds : '';
        if (typeof sec !== 'number' || isNaN(sec) || sec < 1 || sec > 15) { errs.push('第 ' + n + ' 节时长须为 1–15 秒'); }
        const sp = String((b && b.speaker) || '').trim();
        if (names.indexOf(sp) < 0) { errs.push('第 ' + n + ' 节「谁在说」不在人物表：' + (sp || '空')); }
    });
    if (errs.length) {
        toast('❌ ' + errs[0] + (errs.length > 1 ? '（共 ' + errs.length + ' 项待改）' : ''), 'error');
        return;
    }
    const body = { script: JSON.stringify(o) };
    if (o.title) { body.title = o.title; }   // 顶层 title → 服务端无条件 UPDATE（AI 生成路径仍只在为空时写入）
    const r = await api('/api/video-plans/' + PLAN_ID, { method: 'PUT', body: JSON.stringify(body) });
    if (r && r.ok) {
        SCRIPT_OBJ = o;
        toast('✅ 剧本已保存', 'success');
        await load();   // 回读服务端：标题 / 分节 / 需求行是否真落库
    } else {
        toast('❌ ' + ((r && r.error) || '保存失败'), 'error');
    }
}

async function genStoryboard() {
    if (!PLAN) { toast('计划未加载', 'error'); return; }
    toast('🤖 AI 正在生成分镜...', 'info');
    document.getElementById('plan-status').textContent = '生成中…';
    await saveRoleIds();                                  // 调用前先把素材包 role_ids 落库
    const r = await api('/api/video-plans/' + PLAN_ID + '/storyboard', {method: 'POST'});
    if (!r.ok) { toast('❌ ' + (r.error || '生成失败'), 'error'); document.getElementById('plan-status').textContent = PLAN.status || ''; return; }
    // 分镜接口已不产出素材需求/提词 → 只在响应真的带该字段时才更新（不再清空「素材」Tab 的成果）
    if (Array.isArray(r.asset_requirements)) { REQS = r.asset_requirements; }
    if (Array.isArray(r.asset_prompts)) { PROMPTS = r.asset_prompts; }
    await loadRoles();
    SCENES = (r.shots || []).map(s => ({
        visual: s.visual_prompt || '', line: s.subtitle || '',
        duration: s.duration_s || 5, shot_type: s.shot_type || '',
        characters: s.characters || [], scene: s.scene || '', props: s.props || [],
        shot_face: s.shot_face || '',
        music_hint: s.music_hint || '', template_hint: s.template_hint || 'U02'
    }));
    document.getElementById('plan-status').textContent = 'storyboard_done';
    renderScenes();
    renderReqs();
    toast('✅ ' + SCENES.length + ' 个镜头（' + (r.total_duration_s || '—') + ' 秒）', 'success');
    await saveAll();
}

load();
</script>
{% endblock %}
