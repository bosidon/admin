{% extends "base.html" %}
{% block title %}设置 - 视频创作平台{% endblock %}
{% block page_title %}⚙️ 设置{% endblock %}

{% block content %}
<div class="card" style="max-width:600px;">
    <h3 style="margin-bottom:20px;">API配置</h3>
    
    <div class="form-group">
        <label class="form-label">接口地址</label>
        <input type="text" class="form-input" id="llm-base-url" placeholder="https://api.deepseek.com/v1/chat/completions">
    </div>
    
    <div class="form-group">
        <label class="form-label">模型名</label>
        <input type="text" class="form-input" id="llm-model" placeholder="deepseek-chat">
    </div>

    <div class="form-group">
        <label class="form-label">并行度（同时进行的 AI 任务数）</label>
        <input type="number" min="1" max="8" class="form-input" id="llm-parallel" placeholder="2">
    </div>
    
    <div class="form-group">
        <label class="form-label">LLM API Key</label>
        <input type="password" class="form-input" id="llm-api-key" placeholder="sk-...">
    </div>
    
    <div class="form-group">
        <label class="form-label">图像生成 API Key（可灵/百炼等）</label>
        <input type="password" class="form-input" id="image-key" placeholder="API Key">
    </div>
    
    <div class="form-group">
        <label class="form-label">TTS API Key（语音合成）</label>
        <input type="password" class="form-input" id="tts-key" placeholder="API Key">
    </div>
    
    <button class="btn btn-primary" onclick="saveSettings()">保存配置</button>
</div>

<div class="card" style="max-width:600px;">
    <h3 style="margin-bottom:20px;">🎨 AI 生图（AutoDL ComfyUI）</h3>

    <div class="form-group">
        <label class="form-label">应用实例 UUID（pro- 开头）</label>
        <input type="text" class="form-input" id="comfy-instance-uuid" placeholder="pro-xxxxxxxxxxxx">
    </div>

    <div class="form-group">
        <label class="form-label">AutoDL 开发者 Token（开关机用）</label>
        <input type="password" class="form-input" id="comfy-api-token" placeholder="粘贴开发者Token">
    </div>

    <div class="form-group">
        <label class="form-label">ComfyUI 地址（留空则自动从实例详情取）</label>
        <input type="text" class="form-input" id="comfy-base-url" placeholder="https://xxx.seetacloud.com:8443">
    </div>

    <div class="form-group">
        <label class="form-label">绘图模型（unet）</label>
        <input type="text" class="form-input" id="comfy-unet" placeholder="qwen_image_fp8_e4m3fn.safetensors">
    </div>

    <div class="form-group">
        <label class="form-label" style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="comfy-auto-shutdown" style="width:auto;"> 任务结束后自动关机（省钱）
        </label>
    </div>

    <div style="display:flex;gap:10px;align-items:center;">
        <button class="btn btn-primary" onclick="saveComfy()">保存生图配置</button>
        <button class="btn btn-outline" onclick="checkInstance()">查看实例状态</button>
        <span id="comfy-status" style="font-size:12px;color:#64748b;"></span>
    </div>
</div>

<div class="card" style="max-width:600px;">
    <h3 style="margin-bottom:16px;">📋 配图 Agent System Prompt</h3>

    <div class="form-group">
        <label class="form-label">System Prompt</label>
        <textarea class="form-input" id="plan-system-prompt" rows="20"
            style="font-family:ui-monospace,monospace;font-size:12px;line-height:1.6;resize:vertical;"></textarea>
    </div>

    <div style="display:flex;gap:10px;align-items:center;">
        <button class="btn btn-primary" onclick="savePrompts()">保存提示词</button>
        <button class="btn btn-outline" onclick="resetPlanPrompt()">恢复内置默认</button>
    </div>
</div>

<div class="card" style="max-width:600px;">
    <h3 style="margin-bottom:20px;">默认配置</h3>
    
    <div class="form-group">
        <label class="form-label">默认视频类型</label>
        <select class="form-select" id="default-type">
            <option value="mixed">混合</option>
            <option value="narration_visual">口播+画面</option>
            <option value="ai_visual">纯AI画面</option>
        </select>
    </div>
    
    <div class="form-group">
        <label class="form-label">默认视觉风格</label>
        <select class="form-select" id="default-style">
            <optgroup label="摄影写实">
                <option value="realistic">写实风</option>
                <option value="cinematic">电影感</option>
                <option value="commercial">商业质感</option>
            </optgroup>
            <optgroup label="绘画插画">
                <option value="illustration">插画风</option>
                <option value="watercolor">水彩风</option>
                <option value="ink">水墨国风</option>
                <option value="anime">动漫风</option>
            </optgroup>
            <optgroup label="数字渲染">
                <option value="3d">3D风</option>
                <option value="concept">概念艺术</option>
            </optgroup>
            <optgroup label="氛围与设计">
                <option value="artistic">意境风</option>
                <option value="mystic">暗黑神秘</option>
                <option value="minimal">极简留白</option>
                <option value="editorial">杂志排版</option>
                <option value="collage">拼贴杂志</option>
            </optgroup>
        </select>
    </div>
    
    <div class="form-group">
        <label class="form-label">默认目标平台</label>
        <select class="form-select" id="default-platform">
            <option value="video_account">视频号</option>
            <option value="douyin">抖音</option>
            <option value="bilibili">B站</option>
            <option value="xiaohongshu">小红书</option>
        </select>
    </div>
    
    <button class="btn btn-primary" onclick="saveDefaults()">保存默认配置</button>
</div>
{% endblock %}

{% block scripts %}
<script>
async function saveComfy() {
    const data = {
        comfy_instance_uuid: document.getElementById('comfy-instance-uuid').value.trim(),
        comfy_api_token: document.getElementById('comfy-api-token').value.trim(),
        comfy_base_url: document.getElementById('comfy-base-url').value.trim(),
        comfy_unet: document.getElementById('comfy-unet').value.trim(),
        comfy_auto_shutdown: document.getElementById('comfy-auto-shutdown').checked ? '1' : '0'
    };
    await api('/api/settings', {method: 'POST', body: JSON.stringify(data)});
    toast('生图配置已保存');
}

async function checkInstance() {
    const el = document.getElementById('comfy-status');
    el.textContent = '查询中…';
    const r = await api('/api/illustrate/instance');
    el.textContent = r.ok ? ('实例状态：' + r.status) : ('查询失败：' + (r.msg || '未知'));
}

async function loadSettings() {
    const settings = await api('/api/settings');
    document.getElementById('llm-base-url').value = settings['llm_base_url'] || 'https://api.deepseek.com/v1/chat/completions';
    document.getElementById('llm-model').value = settings['llm_model'] || 'deepseek-chat';
    document.getElementById('llm-parallel').value = settings['llm_parallel'] || '2';
    if (settings['llm_api_key']) document.getElementById('llm-api-key').value = settings['llm_api_key'];
    document.getElementById('comfy-instance-uuid').value = settings['comfy_instance_uuid'] || '';
    document.getElementById('comfy-api-token').value = settings['comfy_api_token'] || '';
    document.getElementById('comfy-base-url').value = settings['comfy_base_url'] || '';
    document.getElementById('comfy-unet').value = settings['comfy_unet'] || 'qwen_image_fp8_e4m3fn.safetensors';
    document.getElementById('comfy-auto-shutdown').checked = (settings['comfy_auto_shutdown'] || '1') === '1';
    const pr = await api('/api/prompts/plan');
    document.getElementById('plan-system-prompt').value = (pr && pr.content) || '';
    if (settings['image_key']) document.getElementById('image-key').value = settings['image_key'];
    if (settings['tts_key']) document.getElementById('tts-key').value = settings['tts_key'];
    if (settings['default_type']) document.getElementById('default-type').value = settings['default_type'];
    const ds = document.getElementById('default-style');
    ds.value = settings['default_style'] || 'artistic';
    if (!ds.value) ds.value = 'artistic';
    if (settings['default_platform']) document.getElementById('default-platform').value = settings['default_platform'];
}

async function saveSettings() {
    const data = {
        llm_base_url: document.getElementById('llm-base-url').value,
        llm_model: document.getElementById('llm-model').value,
        llm_api_key: document.getElementById('llm-api-key').value,
        llm_parallel: document.getElementById('llm-parallel').value || '2',
        image_key: document.getElementById('image-key').value,
        tts_key: document.getElementById('tts-key').value
    };
    await api('/api/settings', {method: 'POST', body: JSON.stringify(data)});
    toast('配置保存成功');
}

async function savePrompts() {
    const sys = document.getElementById('plan-system-prompt').value.trim();
    if (!sys) { alert('System Prompt 不能为空（点「恢复内置默认」可找回）'); return; }
    const miss = ['images', 'bg', 'aspect'].filter(k => sys.indexOf(k) < 0);
    if (miss.length && !confirm('没检测到字段名：' + miss.join('、') +
        '\n缺了这些，方案可能解析失败。仍要保存吗？')) return;
    const r = await api('/api/prompts/plan', {method: 'POST', body: JSON.stringify({content: sys})});
    if (!r || r.error) { toast('❌ ' + ((r && r.error) || '保存失败'), 'error'); return; }
    toast('提示词已保存');
}

async function resetPlanPrompt() {
    if (!confirm('恢复内置默认 System Prompt？\n（会覆盖当前 prompts/image_agent.md 的内容）')) return;
    const r = await api('/api/prompts/plan', {method: 'POST', body: JSON.stringify({reset: true})});
    if (!r || r.error) { toast('❌ ' + ((r && r.error) || '恢复失败'), 'error'); return; }
    document.getElementById('plan-system-prompt').value = r.content || '';
    toast('已恢复内置默认');
}

async function saveDefaults() {
    const data = {
        default_type: document.getElementById('default-type').value,
        default_style: document.getElementById('default-style').value,
        default_platform: document.getElementById('default-platform').value
    };
    await api('/api/settings', {method: 'POST', body: JSON.stringify(data)});
    toast('默认配置保存成功');
}

loadSettings();
</script>
{% endblock %}
