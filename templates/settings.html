{% extends "base.html" %}
{% block title %}设置 - 视频创作平台{% endblock %}
{% block page_title %}⚙️ 设置{% endblock %}

{% block content %}
<div class="card" style="max-width:600px;">
    <h3 style="margin-bottom:20px;">API配置</h3>
    
    <div class="form-group">
        <label class="form-label">接口地址</label>
        <input type="text" class="form-input" id="llm-base-url" placeholder="https://api.deepseek.com/v1/chat/completions">
    </div>
    
    <div class="form-group">
        <label class="form-label">模型名</label>
        <input type="text" class="form-input" id="llm-model" placeholder="deepseek-chat">
    </div>

    <div class="form-group">
        <label class="form-label">并行度（同时进行的 AI 任务数）</label>
        <input type="number" min="0" max="32" class="form-input" id="llm-parallel" placeholder="2（填 0 = 不限）">
    </div>
    
    <div class="form-group">
        <label class="form-label">LLM API Key</label>
        <input type="password" class="form-input" id="llm-api-key" placeholder="sk-...">
    </div>
    
    <div class="form-group">
        <label class="form-label">图像生成 API Key（可灵/百炼等）</label>
        <input type="password" class="form-input" id="image-key" placeholder="API Key">
    </div>
    
    <div class="form-group">
        <label class="form-label">TTS API Key（语音合成）</label>
        <input type="password" class="form-input" id="tts-key" placeholder="API Key">
    </div>
    
    <button class="btn btn-primary" onclick="saveSettings()">保存配置</button>
</div>

<div class="card" style="max-width:600px;">
    <h3 style="margin-bottom:20px;">🎨 AI 生图（AutoDL ComfyUI）</h3>

    <div class="form-group">
        <label class="form-label">实例池（每行一台：<code>pro-xxxxxxxxxxxx|备注</code>，顺序即优先级）</label>
        <textarea class="form-input" id="comfy-instances" rows="3" placeholder="pro-7895a8aee534|北京B区 ¥1.68/h&#10;pro-7898f1e60d45|西北B区 ¥6.46/h"
                  style="width:100%;box-sizing:border-box;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;resize:vertical;"></textarea>
    </div>

    <div class="form-group">
        <label class="form-label">AutoDL 开发者 Token（开关机用）</label>
        <input type="password" class="form-input" id="comfy-api-token" placeholder="粘贴开发者Token">
    </div>

    <div class="form-group">
        <label class="form-label">ComfyUI 地址（留空则自动从实例详情取）</label>
        <input type="text" class="form-input" id="comfy-base-url" placeholder="https://xxx.seetacloud.com:8443">
    </div>

    <div class="form-group">
        <label class="form-label">模型组</label>
        <select class="form-select" id="comfy-model-group" onchange="applyModelGroup()"></select>
    </div>

    <div class="form-group">
        <label class="form-label">生成档位</label>
        <select class="form-select" id="comfy-preset" onchange="applyPreset()">
            <option value="standard">标准（20 步 · 无 LoRA）</option>
            <option value="fast4">极速（4 步 · Lightning）</option>
            <option value="fast8">快速（8 步 · Lightning）</option>
            <option value="custom">自定义</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-label">底模（unet）</label>
        <input type="text" class="form-input" id="comfy-unet" oninput="syncModelGroup()" placeholder="qwen_image_fp8_e4m3fn.safetensors">
    </div>

    <div class="form-group">
        <label class="form-label">文本编码器</label>
        <input type="text" class="form-input" id="comfy-clip" oninput="syncModelGroup()" placeholder="qwen_2.5_vl_7b_fp8_scaled.safetensors">
    </div>

    <div class="form-group">
        <label class="form-label">VAE</label>
        <input type="text" class="form-input" id="comfy-vae" oninput="syncModelGroup()" placeholder="qwen_image_vae.safetensors">
    </div>

    <div class="form-group">
        <label class="form-label">LoRA（逗号分隔，可写 名称:权重）</label>
        <input type="text" class="form-input" id="comfy-lora" oninput="syncPreset()" placeholder="Qwen-Image-Lightning-4steps.safetensors:1.0，另一个.safetensors:0.8">
    </div>

    <div class="form-group">
        <label class="form-label">采样参数（步数 / CFG / 采样器 / 调度器 / 降噪）</label>
        <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;">
            <input type="text" class="form-input" id="comfy-steps" oninput="syncPreset()" placeholder="20">
            <input type="text" class="form-input" id="comfy-cfg" oninput="syncPreset()" placeholder="2.5">
            <input type="text" class="form-input" id="comfy-sampler" placeholder="euler">
            <input type="text" class="form-input" id="comfy-scheduler" placeholder="simple">
            <input type="text" class="form-input" id="comfy-denoise" placeholder="1.0">
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">同时出图任务数（GPU 并行上限，≤ 实例池台数）</label>
        <input type="number" class="form-input" id="gpu-parallel" min="1" max="8" placeholder="2">
    </div>

    <div class="form-group">
        <label class="form-label" style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="comfy-auto-shutdown" style="width:auto;"> 任务结束后自动关机（省钱）
        </label>
    </div>

    <div id="comfy-check" style="margin:4px 0 12px;font-size:12px;color:#475569;line-height:1.9;white-space:pre-wrap;"></div>

    <div style="display:flex;gap:10px;align-items:center;">
        <button class="btn btn-primary" onclick="saveComfy()">保存生图配置</button>
        <button class="btn btn-outline" onclick="checkComfy()">检测配置</button>
        <button class="btn btn-outline" onclick="checkInstance()">查看实例状态</button>
        <span id="comfy-status" style="font-size:12px;color:#64748b;"></span>
    </div>
</div>

<div class="card" style="max-width:600px;">
    <h3 style="margin-bottom:16px;">📋 配图 Agent System Prompt</h3>

    <div class="form-group">
        <label class="form-label">System Prompt</label>
        <textarea class="form-input" id="plan-system-prompt" rows="20"
            style="font-family:ui-monospace,monospace;font-size:12px;line-height:1.6;resize:vertical;"></textarea>
    </div>

    <div style="display:flex;gap:10px;align-items:center;">
        <button class="btn btn-primary" onclick="savePrompts()">保存提示词</button>
        <button class="btn btn-outline" onclick="resetPlanPrompt()">恢复内置默认</button>
    </div>
</div>

<div class="card" style="max-width:600px;">
    <h3 style="margin-bottom:20px;">默认配置</h3>
    
    <div class="form-group">
        <label class="form-label">默认视频类型</label>
        <select class="form-select" id="default-type">
            <option value="mixed">混合</option>
            <option value="narration_visual">口播+画面</option>
            <option value="ai_visual">纯AI画面</option>
        </select>
    </div>
    
    <div class="form-group">
        <label class="form-label">默认视觉风格</label>
        <select class="form-select" id="default-style">
            {% for g in style_groups %}
            <optgroup label="{{ g.name }}">
                {% for s in g.styles %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
            </optgroup>
            {% endfor %}
        </select>
    </div>
    
    <div class="form-group">
        <label class="form-label">默认目标平台</label>
        <select class="form-select" id="default-platform">
            <option value="video_account">视频号</option>
            <option value="douyin">抖音</option>
            <option value="bilibili">B站</option>
            <option value="xiaohongshu">小红书</option>
        </select>
    </div>
    
    <button class="btn btn-primary" onclick="saveDefaults()">保存默认配置</button>
</div>
{% endblock %}

{% block scripts %}
<script>
async function saveComfy(msg) {
    const data = {
        comfy_instances: document.getElementById('comfy-instances').value.trim(),
        comfy_instance_uuid: (document.getElementById('comfy-instances').value.trim().split('\n')[0] || '').split('|')[0].trim(),
        gpu_parallel: document.getElementById('gpu-parallel').value.trim() || '2',
        comfy_api_token: document.getElementById('comfy-api-token').value.trim(),
        comfy_base_url: document.getElementById('comfy-base-url').value.trim(),
        comfy_unet: document.getElementById('comfy-unet').value.trim(),
        comfy_clip: document.getElementById('comfy-clip').value.trim(),
        comfy_vae: document.getElementById('comfy-vae').value.trim(),
        comfy_lora: document.getElementById('comfy-lora').value.trim(),
        comfy_steps: document.getElementById('comfy-steps').value.trim(),
        comfy_cfg: document.getElementById('comfy-cfg').value.trim(),
        comfy_sampler: document.getElementById('comfy-sampler').value.trim(),
        comfy_scheduler: document.getElementById('comfy-scheduler').value.trim(),
        comfy_denoise: document.getElementById('comfy-denoise').value.trim(),
        comfy_auto_shutdown: document.getElementById('comfy-auto-shutdown').checked ? '1' : '0'
    };
    await api('/api/settings', {method: 'POST', body: JSON.stringify(data)});
    toast(msg || '生图配置已保存');
}

let MODEL_GROUPS = [];
let PRESETS_DEFAULT = [];

function currentPresets() {
    const sel = document.getElementById('comfy-model-group');
    const g = MODEL_GROUPS.filter(function(m) { return m.id === (sel ? sel.value : ''); })[0];
    return (g && g.presets && g.presets.length) ? g.presets : PRESETS_DEFAULT;
}

function buildPresetOptions() {
    const sel = document.getElementById('comfy-preset');
    if (!sel) return;
    sel.innerHTML = '';
    currentPresets().forEach(function(p) {
        const o = document.createElement('option');
        o.value = p.id; o.textContent = p.name;
        sel.appendChild(o);
    });
    const oc = document.createElement('option');
    oc.value = 'custom'; oc.textContent = '自定义';
    sel.appendChild(oc);
}

function syncModelGroup() {
    const sel = document.getElementById('comfy-model-group');
    if (!sel || !MODEL_GROUPS.length) return;
    const v = function(id) { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
    const u = v('comfy-unet'), c = v('comfy-clip'), x = v('comfy-vae');
    let hit = 'custom';
    MODEL_GROUPS.forEach(function(m) {
        if (m.unet === u && m.clip === c && m.vae === x) hit = m.id;
    });
    sel.value = hit;
}

async function applyModelGroup() {
    const sel = document.getElementById('comfy-model-group');
    const m = MODEL_GROUPS.filter(function(x) { return x.id === sel.value; })[0];
    if (!m) return;
    document.getElementById('comfy-unet').value = m.unet;
    document.getElementById('comfy-clip').value = m.clip;
    document.getElementById('comfy-vae').value = m.vae;
    buildPresetOptions();
    syncPreset();
    await saveComfy('已切换为「' + m.name + '」');
}

function syncPreset() {
    const sel = document.getElementById('comfy-preset');
    if (!sel) return;
    const v = function(id) { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
    const lora = v('comfy-lora'), steps = v('comfy-steps'), cfg = v('comfy-cfg');
    let hit = 'custom';
    currentPresets().forEach(function(p) {
        if (String(p.lora || '') === lora && String(p.steps) === steps && String(p.cfg) === cfg) hit = p.id;
    });
    sel.value = hit;
}

async function applyPreset() {
    const sel = document.getElementById('comfy-preset');
    const p = currentPresets().filter(function(x) { return x.id === sel.value; })[0];
    if (!p) return;
    document.getElementById('comfy-lora').value = p.lora || '';
    document.getElementById('comfy-steps').value = p.steps;
    document.getElementById('comfy-cfg').value = p.cfg;
    await saveComfy('已切换为「' + sel.options[sel.selectedIndex].text + '」');
}

function comfyForm() {
    const g = function(id) { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
    return {
        comfy_unet: g('comfy-unet'), comfy_clip: g('comfy-clip'), comfy_vae: g('comfy-vae'),
        comfy_lora: g('comfy-lora'), comfy_steps: g('comfy-steps'), comfy_cfg: g('comfy-cfg'),
        comfy_sampler: g('comfy-sampler'), comfy_scheduler: g('comfy-scheduler'),
        comfy_denoise: g('comfy-denoise')
    };
}

async function checkComfy() {
    const box = document.getElementById('comfy-check');
    box.textContent = '检测中…';
    let j = null;
    try {
        j = await api('/api/comfy/check', {method: 'POST', body: JSON.stringify(comfyForm())});
    } catch (e) {
        box.textContent = '⚠ 检测失败：' + e.message;
        return;
    }
    if (!j || !j.ok) {
        box.textContent = '⚠ ' + ((j && j.reason) || '检测失败');
        return;
    }
    const lines = [];
    (j.items || []).forEach(function(it) {
        lines.push((it.ok ? '✅' : '❌') + ' ' + it.label + '：' + (it.value || '（空）') +
            (it.hint ? '  —— ' + it.hint : ''));
    });
    (j.loras || []).forEach(function(l) {
        lines.push((l.ok ? '✅' : '❌') + ' LoRA：' + l.name +
            (l.weight === 1 ? '' : ':' + l.weight) + (l.hint ? '  —— ' + l.hint : ''));
    });
    (j.notes || []).forEach(function(n) { lines.push('⚠ ' + n); });
    const c = j.counts || {};
    lines.push('清单：底模 ' + (c.comfy_unet || 0) + ' · 编码器 ' + (c.comfy_clip || 0) +
        ' · VAE ' + (c.comfy_vae || 0) + ' · LoRA ' + (c.comfy_lora || 0) +
        ' · 采样器 ' + (c.comfy_sampler || 0) + ' · 调度器 ' + (c.comfy_scheduler || 0));
    box.textContent = lines.join('\n');
}

async function checkInstance() {
    const el = document.getElementById('comfy-status');
    el.textContent = '查询中…';
    const r = await api('/api/illustrate/instance');
    el.textContent = r.ok ? ('实例状态：' + r.status) : ('查询失败：' + (r.msg || '未知'));
}

async function loadSettings() {
    const settings = await api('/api/settings');
    document.getElementById('llm-base-url').value = settings['llm_base_url'] || 'https://api.deepseek.com/v1/chat/completions';
    document.getElementById('llm-model').value = settings['llm_model'] || 'deepseek-chat';
    document.getElementById('llm-parallel').value = settings['llm_parallel'] || '2';
    if (settings['llm_api_key']) document.getElementById('llm-api-key').value = settings['llm_api_key'];
    document.getElementById('comfy-instances').value = settings['comfy_instances'] || settings['comfy_instance_uuid'] || '';
    document.getElementById('gpu-parallel').value = settings['gpu_parallel'] || '2';
    document.getElementById('comfy-api-token').value = settings['comfy_api_token'] || '';
    document.getElementById('comfy-base-url').value = settings['comfy_base_url'] || '';
    document.getElementById('comfy-unet').value = settings['comfy_unet'] || 'qwen_image_fp8_e4m3fn.safetensors';
    document.getElementById('comfy-clip').value = settings['comfy_clip'] || 'qwen_2.5_vl_7b_fp8_scaled.safetensors';
    document.getElementById('comfy-vae').value = settings['comfy_vae'] || 'qwen_image_vae.safetensors';
    document.getElementById('comfy-lora').value = settings['comfy_lora'] || '';
    document.getElementById('comfy-steps').value = settings['comfy_steps'] || '20';
    document.getElementById('comfy-cfg').value = settings['comfy_cfg'] || '2.5';
    document.getElementById('comfy-sampler').value = settings['comfy_sampler'] || 'euler';
    document.getElementById('comfy-scheduler').value = settings['comfy_scheduler'] || 'simple';
    document.getElementById('comfy-denoise').value = settings['comfy_denoise'] || '1.0';
    document.getElementById('comfy-auto-shutdown').checked = (settings['comfy_auto_shutdown'] || '1') === '1';
    try {
        const mc = await api('/api/models/groups');
        MODEL_GROUPS = (mc && mc.groups) || [];
        PRESETS_DEFAULT = (mc && mc.presets_default) || [];
    } catch (e) {
        MODEL_GROUPS = [];
        PRESETS_DEFAULT = [];
    }
    const mgSel = document.getElementById('comfy-model-group');
    mgSel.innerHTML = '';
    MODEL_GROUPS.forEach(function(m) {
        const o = document.createElement('option');
        o.value = m.id; o.textContent = m.name;
        mgSel.appendChild(o);
    });
    const mgC = document.createElement('option');
    mgC.value = 'custom'; mgC.textContent = '自定义';
    mgSel.appendChild(mgC);
    syncModelGroup();
    buildPresetOptions();
    syncPreset();
    const pr = await api('/api/prompts/plan');
    document.getElementById('plan-system-prompt').value = (pr && pr.content) || '';
    if (settings['image_key']) document.getElementById('image-key').value = settings['image_key'];
    if (settings['tts_key']) document.getElementById('tts-key').value = settings['tts_key'];
    if (settings['default_type']) document.getElementById('default-type').value = settings['default_type'];
    const ds = document.getElementById('default-style');
    ds.value = settings['default_style'] || 'artistic';
    if (!ds.value) ds.value = 'artistic';
    if (settings['default_platform']) document.getElementById('default-platform').value = settings['default_platform'];
}

async function saveSettings() {
    const data = {
        llm_base_url: document.getElementById('llm-base-url').value,
        llm_model: document.getElementById('llm-model').value,
        llm_api_key: document.getElementById('llm-api-key').value,
        llm_parallel: document.getElementById('llm-parallel').value || '2',
        image_key: document.getElementById('image-key').value,
        tts_key: document.getElementById('tts-key').value
    };
    await api('/api/settings', {method: 'POST', body: JSON.stringify(data)});
    toast('配置保存成功');
}

async function savePrompts() {
    const sys = document.getElementById('plan-system-prompt').value.trim();
    if (!sys) { alert('System Prompt 不能为空（点「恢复内置默认」可找回）'); return; }
    const miss = ['images', 'bg', 'aspect'].filter(k => sys.indexOf(k) < 0);
    if (miss.length && !confirm('没检测到字段名：' + miss.join('、') +
        '\n缺了这些，方案可能解析失败。仍要保存吗？')) return;
    const r = await api('/api/prompts/plan', {method: 'POST', body: JSON.stringify({content: sys})});
    if (!r || r.error) { toast('❌ ' + ((r && r.error) || '保存失败'), 'error'); return; }
    toast('提示词已保存');
}

async function resetPlanPrompt() {
    if (!confirm('恢复内置默认 System Prompt？\n（会覆盖当前 prompts/image_agent.md 的内容）')) return;
    const r = await api('/api/prompts/plan', {method: 'POST', body: JSON.stringify({reset: true})});
    if (!r || r.error) { toast('❌ ' + ((r && r.error) || '恢复失败'), 'error'); return; }
    document.getElementById('plan-system-prompt').value = r.content || '';
    toast('已恢复内置默认');
}

async function saveDefaults() {
    const data = {
        default_type: document.getElementById('default-type').value,
        default_style: document.getElementById('default-style').value,
        default_platform: document.getElementById('default-platform').value
    };
    await api('/api/settings', {method: 'POST', body: JSON.stringify(data)});
    toast('默认配置保存成功');
}

loadSettings();
</script>
{% endblock %}
