{% extends "base.html" %}
{% block title %}文案制作 - 仙宝内容平台{% endblock %}
{% block page_title %}✍️ 文案制作{% endblock %}
{% block topbar_right %}
<button class="btn btn-outline" onclick="load()">🔄 刷新</button>
{% endblock %}

{% block content %}
<!-- 业务线 -->
<div class="card" style="padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <div id="line-pills" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
    <span id="line-home" style="margin-left:auto;font-size:12px;color:#94a3b8;"></span>
</div>

<!-- 制作 -->
<div class="card">
    <div id="gen-form"></div>
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:12px;">
        <span id="gen-status" style="font-size:12px;color:#94a3b8;"></span>
        <button class="btn btn-primary" id="gen-btn" onclick="doGenerate()">✨ 生成文案</button>
    </div>
</div>

<!-- 成稿 -->
<div class="card" id="draft-card" style="display:none;">
    <input id="dr-title" placeholder="标题" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:16px;font-weight:600;margin-bottom:10px;">
    <textarea id="dr-body" rows="16" placeholder="正文" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;line-height:1.8;font-family:inherit;resize:vertical;"></textarea>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;">
        <button class="btn btn-primary btn-sm" onclick="saveDraft()">💾 保存</button>
        <a class="btn btn-outline btn-sm" id="dr-illustrate" href="#" target="_blank">🖼️ 去配图</a>
        <button class="btn btn-outline btn-sm" onclick="copyDraftLink()">🔗 复制推广链接</button>
        <span style="margin-left:auto;font-size:12px;color:#94a3b8;">改写为</span>
        <select id="dr-platform" style="padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;"></select>
        <select id="dr-type" style="padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;"></select>
        <button class="btn btn-outline btn-sm" onclick="rewriteDraft()">🔁 改写</button>
    </div>
</div>

<!-- 筛选栏 -->
<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
    <button class="btn btn-outline btn-sm filter-btn active" onclick="filterStatus('')">全部</button>
    <button class="btn btn-outline btn-sm filter-btn" onclick="filterStatus('pending')">⏳ 待审</button>
    <button class="btn btn-outline btn-sm filter-btn" onclick="filterStatus('approved')">✅ 已通过</button>
    <button class="btn btn-outline btn-sm filter-btn" onclick="filterStatus('published')">📤 已发布</button>
</div>

<div class="card" style="padding:0;overflow:hidden;">
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
        <thead>
            <tr style="background:#f8fafc;border-bottom:1px solid var(--border);text-align:left;">
                <th style="padding:12px 16px;font-weight:600;width:30%;">标题</th>
                <th style="padding:12px 8px;font-weight:600;width:10%;">平台</th>
                <th style="padding:12px 8px;font-weight:600;width:10%;">书目</th>
                <th style="padding:12px 8px;font-weight:600;width:12%;">话题</th>
                <th style="padding:12px 8px;font-weight:600;width:10%;">类型</th>
                <th style="padding:12px 8px;font-weight:600;width:8%;">字数</th>
                <th style="padding:12px 8px;font-weight:600;width:10%;">状态</th>
                <th style="padding:12px 8px;font-weight:600;width:8%;">时间</th>
                <th style="padding:12px 16px;font-weight:600;width:12%;text-align:center;white-space:nowrap;">操作</th>
            </tr>
        </thead>
        <tbody id="article-tbody">
            <tr><td colspan="9" style="text-align:center;padding:40px;color:#94a3b8;">加载中...</td></tr>
        </tbody>
    </table>
</div>

{% endblock %}

{% block scripts %}
<script>
let OPTS = null;
let currentFilter = '';

const PLATFORM_MAP = {wechat:'公众号',xiaohongshu:'小红书',video_account:'视频号',douyin:'抖音',bilibili:'B站',kuaishou:'快手',podcast:'播客',zhihu:'知乎',toutiao:'头条'};
const CONTENT_TYPE_MAP = {'article':'📄 图文文章','short_video':'🎬 短视频脚本','long_video':'📹 长视频脚本','speech':'🎤 口播稿'};

function formatCST(utcStr) {
    if (!utcStr) return '-';
    const d = new Date(utcStr + 'Z');
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

const STATUS_TAG = {
    'pending': '<span style="background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:12px;font-size:12px;">⏳ 待审</span>',
    'approved': '<span style="background:#dcfce7;color:#166534;padding:2px 8px;border-radius:12px;font-size:12px;">✅ 已通过</span>',
    'published': '<span style="background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:12px;font-size:12px;">📤 已发布</span>',
    'rejected': '<span style="background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:12px;font-size:12px;">🗑️ 已删除</span>',
};

async function load() {
    const qs = [];
    if (currentFilter) qs.push('status=' + currentFilter);
    if (LINE) qs.push('line=' + LINE);
    const articles = await api('/api/articles' + (qs.length ? '?' + qs.join('&') : ''));
    USED = new Set(articles.map(a => a.topic).filter(Boolean));
    const tbody = document.getElementById('article-tbody');
    if (!articles.length) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:#94a3b8;">📭 暂无内容</td></tr>';
        return;
    }
    tbody.innerHTML = articles.map(a => {
        const contentType = CONTENT_TYPE_MAP[a.content_type]||a.content_type||'-';
        const titleLink = `<a href="/articles/${a.id}" style="color:inherit;text-decoration:none;font-weight:500;">${a.title||'未命名'}</a>`;
        const date = formatCST(a.created_at);
        const refBadge = a.ref_count > 0 ? ` <span style="display:inline-block;background:#dcfce7;color:#166534;padding:2px 6px;border-radius:4px;font-size:12px;margin-left:6px;vertical-align:middle;" title="该文案带来的注册数">引流 ${a.ref_count}</span>` : '';
        const actions = `<a href="/articles/${a.id}" class="btn btn-outline btn-sm" title="查看">👁️</a>`
            + ` <a href="/illustrate/${a.id}" class="btn btn-outline btn-sm" title="配图">🖼️</a>`
            + (a.promo_link ? ` <button class="btn btn-outline btn-sm promo-copy-btn" data-link="${a.promo_link}" title="复制推广链接">🔗</button>` : '');
        const statusActions = (a.status==='pending'||a.status==='draft')
            ? `<button class="btn btn-success btn-sm" onclick="updateStatus('articles',${a.id},'approved')" title="通过">✅</button>`
            : a.status==='approved'
            ? `<button class="btn btn-primary btn-sm" onclick="updateStatus('articles',${a.id},'published')" title="发布">📤</button>`
            : '';
        const delBtn = ` <button class="btn btn-danger btn-sm" onclick="deleteArticle(${a.id})" title="删除">🗑️</button>`;

        return `<tr style="border-bottom:1px solid #f1f5f9;">
            <td style="padding:10px 16px;">${titleLink}${refBadge}</td>
            <td style="padding:10px 8px;"><span style="background:#ede9fe;color:#5b21b6;padding:2px 6px;border-radius:4px;font-size:12px;">${PLATFORM_MAP[a.platform]||a.platform||'-'}</span></td>
            <td style="padding:10px 8px;font-size:13px;color:#64748b;">${a.book ? '<a href="https://read.xianbao.love/books?q='+encodeURIComponent(a.book)+'" target="_blank" style="color:inherit;text-decoration:none;">'+a.book+'</a>' : '-'}</td>
            <td style="padding:10px 8px;font-size:13px;color:#64748b;">${a.topic||'-'}</td>
            <td style="padding:10px 8px;font-size:12px;">${contentType}</td>
            <td style="padding:10px 8px;font-size:13px;text-align:right;">${a.word_count||0}</td>
            <td style="padding:10px 8px;">${STATUS_TAG[a.status]||a.status||'-'}</td>
            <td style="padding:10px 8px;font-size:12px;color:#94a3b8;">${date}</td>
            <td style="padding:10px 16px;text-align:center;white-space:nowrap;">${actions} ${statusActions} ${delBtn}</td>
        </tr>`;
    }).join('');
}

document.addEventListener('click', function(e) {
    const btn = e.target.closest('.promo-copy-btn');
    if (!btn) return;
    const link = btn.dataset.link || '';
    if (!link) return;
    navigator.clipboard.writeText(link)
        .then(() => showToast('✅ 推广链接已复制：' + link, 'success'))
        .catch(() => prompt('复制推广链接：', link));
});

function filterStatus(s) {
    currentFilter = s;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    load();
}

async function deleteArticle(id) {
    if (!confirm('确定删除这篇内容？\n\n关联数据会一并删除：视频计划、出图日志、任务记录、素材记录，以及配图/素材文件。')) return;
    const r = await api('/api/articles/' + id, {method:'DELETE'});
    if (r.ok) { showToast('已删除', 'success'); load(); }
    else { showToast('删除失败', 'error'); }
}

/* ============ 业务线 ============ */
let LINE = 'lingxiu';
let LINES = [];
let LBOOKS = [];
let TOPICS = [];
let USED = new Set();
let DRAFT = null;

const PLATFORM_TYPES = {
    'wechat': ['article', 'speech', 'long_video'],
    'xiaohongshu': ['article'],
    'video_account': ['short_video', 'speech', 'long_video'],
    'douyin': ['short_video', 'speech'],
    'bilibili': ['long_video', 'article'],
    'kuaishou': ['short_video', 'speech'],
    'podcast': ['speech', 'article'],
    'zhihu': ['article', 'speech'],
    'toutiao': ['article', 'short_video'],
};
const DEFAULT_TYPE = {'wechat':'article','xiaohongshu':'article','video_account':'short_video',
    'douyin':'short_video','bilibili':'long_video','kuaishou':'short_video','podcast':'speech',
    'zhihu':'article','toutiao':'article'};
const DEFAULTS = {
    'zhihu+article': {structure:'qa', hook:'提问式', tone:'reflective'},
    'podcast+speech': {structure:'story', hook:'故事式', tone:'reflective'},
    'douyin+short_video': {structure:'listicle', hook:'场景代入', tone:'energetic'},
    'kuaishou+short_video': {structure:'listicle', hook:'场景代入', tone:'energetic'},
    'wechat+article': {structure:'standard', hook:'金句开头', tone:'warm'},
    'toutiao+article': {structure:'listicle', hook:'热点蹭流量', tone:'rational'},
};

function v(id) { const e = document.getElementById(id); return e ? e.value : ''; }
function boxHtml(label, inner) {
    return '<div>'
        + '<div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px;height:18px;line-height:18px;white-space:nowrap;">' + label + '</div>'
        + inner + '</div>';
}
function selHtml(id, opts, def) {
    return '<select id="' + id + '" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;">'
        + opts.map(o => '<option value="' + o.id + '"' + (String(o.id) === String(def) ? ' selected' : '') + '>' + o.name + '</option>').join('')
        + '</select>';
}

async function initLines() {
    const r = await api('/api/lines');
    LINES = (r && r.lines) || [];
    if (!LINES.length) return;
    if (!LINES.some(l => l.id === LINE)) LINE = LINES[0].id;
    renderPills();
    await buildForm();
}

function renderPills() {
    document.getElementById('line-pills').innerHTML = LINES.map(l =>
        '<button class="btn btn-sm ' + (l.id === LINE ? 'btn-primary' : 'btn-outline') + '" onclick="switchLine(\'' + l.id + '\')">'
        + l.icon + ' ' + l.name + '</button>').join('');
    const cur = LINES.find(l => l.id === LINE) || {};
    document.getElementById('line-home').textContent = cur.home ? ('引流落点 ' + cur.home) : '';
}

async function switchLine(id) {
    if (id === LINE) return;
    LINE = id; DRAFT = null; USED = new Set();
    document.getElementById('draft-card').style.display = 'none';
    document.getElementById('gen-status').textContent = '';
    renderPills();
    await buildForm();
    load();
}

function renderTypes(platform) {
    const types = PLATFORM_TYPES[platform] || (OPTS.content_types || []).map(t => t.id);
    const opts = (OPTS.content_types || []).filter(t => types.indexOf(t.id) >= 0);
    const def = DEFAULT_TYPE[platform] || 'article';
    const el = document.getElementById('gen-content_type');
    if (el) el.innerHTML = opts.map(o => '<option value="' + o.id + '"' + (o.id === def ? ' selected' : '') + '>' + o.name + '</option>').join('');
}

function applyDefaults() {
    const d = DEFAULTS[v('gen-platform') + '+' + v('gen-content_type')] || {};
    ['structure', 'hook', 'tone'].forEach(k => {
        const el = document.getElementById('gen-' + k);
        if (el && d[k]) el.value = d[k];
    });
}

async function buildForm() {
    if (!OPTS) OPTS = await api('/api/options');
    if (LINE === 'lingxiu' && !LBOOKS.length) {
        const rb = await api('/api/line-topics?line=lingxiu&kind=book');
        LBOOKS = (rb && rb.items) || [];
    }
    const line = LINES.find(l => l.id === LINE) || {};
    let html = '<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;">';
    if (LINE === 'lingxiu') {
        html += boxHtml('📖 书目', selHtml('gen-book', [{id:'',name:'全部书目'}].concat(LBOOKS), ''));
    } else {
        const kinds = (line.kinds || []);
        html += boxHtml('选题类型', selHtml('gen-topic_kind', kinds, kinds[0] && kinds[0].id));
    }
    html += boxHtml(LINE === 'lingxiu' ? '🎯 话题' : '选题', '<div style="display:flex;gap:6px;">'
        + '<select id="gen-topic_obj" style="flex:1;min-width:0;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;"></select>'
        + '<button class="btn btn-outline" onclick="randTopic()" title="换一个" style="flex:0 0 auto;padding:8px 10px;">🎲</button></div>');
    html += boxHtml('平台', selHtml('gen-platform', (OPTS.platforms || []).map(p => ({id: p.id, name: p.name})), 'wechat'));
    html += boxHtml('形态', '<select id="gen-content_type" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;"></select>');
    html += boxHtml('语气', selHtml('gen-tone', [{id:'',name:'自动选择'}].concat(
        (OPTS.tones || []).map(t => ({id: t.name, name: t.label}))), ''));
    html += boxHtml('角度', selHtml('gen-angle', [{id:'',name:'自动选择'}].concat((OPTS.angles || []).map(a => ({id: a.name, name: a.name}))), ''));
    html += boxHtml('结构', selHtml('gen-structure', [{id:'',name:'自动选择'}].concat((OPTS.structures || []).map(x => ({id: x.name, name: x.label}))), ''));
    html += boxHtml('钩子', selHtml('gen-hook', [{id:'',name:'自动选择'}].concat((OPTS.hooks || []).map(h => ({id: h, name: h}))), ''));
    html += '</div>'
        + '<div id="topic-preview" style="margin-top:10px;font-size:12px;color:#94a3b8;line-height:1.6;"></div>';
    document.getElementById('gen-form').innerHTML = html;

    renderTypes('wechat');
    applyDefaults();
    const p = document.getElementById('gen-platform');
    if (p) p.onchange = function () { renderTypes(this.value); applyDefaults(); };
    const t = document.getElementById('gen-content_type');
    if (t) t.onchange = applyDefaults;

    if (LINE === 'lingxiu') {
        const bs = document.getElementById('gen-book');
        if (bs) bs.onchange = filterLingxiuTopics;
        await loadTopics();
        filterLingxiuTopics();
    } else {
        const k = document.getElementById('gen-topic_kind');
        if (k) k.onchange = loadTopics;
        await loadTopics();
    }
}

async function loadTopics() {
    const kind = v('gen-topic_kind') || (LINE === 'lingxiu' ? 'topic' : '');
    const r = await api('/api/line-topics?line=' + LINE + '&kind=' + encodeURIComponent(kind));
    TOPICS = (r && r.items) || [];
    const sel = document.getElementById('gen-topic_obj');
    if (!sel) return;
    sel.innerHTML = TOPICS.map(o => '<option value="' + String(o.id).replace(/"/g, '&quot;') + '">' + o.name + '</option>').join('');
    sel.onchange = showPreview;
    const pick = TOPICS.find(o => !USED.has(o.id)) || TOPICS[0];
    if (pick) sel.value = String(pick.id);
    showPreview();
}

function filterLingxiuTopics() {
    const sel = document.getElementById('gen-topic_obj');
    if (!sel) return;
    const braw = v('gen-book');
    const b = braw ? braw.replace(/^《/, '').replace(/》$/, '') : '';   // 书名去《》再比
    const list = b ? TOPICS.filter(t => t.book_name === b) : TOPICS.slice(0, 60);
    sel.innerHTML = list.map(o => '<option value="' + String(o.id).replace(/"/g, '&quot;') + '">'
        + (b ? o.name : '《' + (o.book_name || '') + '》 ' + o.name) + tagOf(o) + '</option>').join('');
    sel.onchange = showPreview;
    const pick = list.find(o => !USED.has(o.id)) || list[0];
    if (pick) sel.value = String(pick.id);
    showPreview();
}

function randTopic() {
    const sel = document.getElementById('gen-topic_obj');
    if (!TOPICS.length || !sel) return;
    const pool = TOPICS.filter(o => !USED.has(o.id));
    const pick = (pool.length ? pool : TOPICS)[Math.floor(Math.random() * (pool.length ? pool.length : TOPICS.length))];
    sel.value = String(pick.id);
    showPreview();
}

function tagOf(o) {                    // 选题打标：画像 / 素材字数 / 敏感词 / 建议平台
    const bits = [];
    if (o.seg) bits.push(o.seg);
    if (o.mat_len) bits.push('素材' + o.mat_len + '字');
    if (o.risk && o.risk.length) bits.push('⚠' + o.risk.join('/'));
    else if (o.plat) bits.push(o.plat);
    return bits.length ? ' ｜ ' + bits.join(' · ') : '';
}

function showPreview() {
    const el = document.getElementById('topic-preview');
    if (!el) return;
    const cur = TOPICS.find(o => String(o.id) === v('gen-topic_obj'));
    if (!cur) { el.innerHTML = ''; return; }
    const bits = [];
    if (cur.book_name) bits.push('《' + cur.book_name + '》');
    if (cur.seg) bits.push('画像：' + cur.seg);
    if (cur.mat_len) bits.push('素材 ' + cur.mat_len + ' 字');
    if (cur.plat) bits.push('建议平台：' + cur.plat);
    if (cur.risk && cur.risk.length) bits.push('⚠ 敏感词：' + cur.risk.join('、'));
    const prev = (cur.preview || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    el.innerHTML = (prev ? '<div style="margin-bottom:4px;">' + prev + '</div>' : '')
        + (bits.length ? '<div style="color:#7c3aed;">' + bits.join(' ｜ ') + '</div>' : '');
}

function showDraft(a) {
    DRAFT = a;
    document.getElementById('dr-title').value = a.title || '';
    document.getElementById('dr-body').value = a.content_md || '';
    document.getElementById('dr-illustrate').href = '/illustrate/' + a.id;
    const pf = document.getElementById('dr-platform');
    if (!pf.options.length) {
        pf.innerHTML = (OPTS.platforms || []).map(p => '<option value="' + p.id + '">' + p.name + '</option>').join('');
        document.getElementById('dr-type').innerHTML = (OPTS.content_types || []).map(t => '<option value="' + t.id + '">' + t.name + '</option>').join('');
    }
    document.getElementById('draft-card').style.display = 'block';
    document.getElementById('draft-card').scrollIntoView({behavior: 'smooth', block: 'start'});
}

async function doGenerate() {
    const btn = document.getElementById('gen-btn');
    const st = document.getElementById('gen-status');
    const params = {};
    ['platform', 'content_type', 'tone', 'angle', 'structure', 'hook', 'book', 'topic'].forEach(k => {
        const val = v('gen-' + k);
        if (val) params[k] = val;
    });
    params.line = LINE;
    if (LINE === 'lingxiu') {
        params.book = v('gen-book');
        params.topic = v('gen-topic_obj');
    } else {
        params.topic_kind = v('gen-topic_kind');
        params.topic_obj = v('gen-topic_obj');
    }
    btn.disabled = true; btn.textContent = '⏳ 生成中…';
    st.textContent = '正在生成，约 20~40 秒…';
    try {
        const r = await api('/api/articles/generate', {method: 'POST', body: JSON.stringify(params)});
        if (r && r.ok) {
            st.textContent = '';
            showToast('✅ 生成成功：' + r.title, 'success');
            if (r.warnings && r.warnings.length) {
                st.innerHTML = '<span style="color:#b45309;">⚠ 敏感词提醒：' + r.warnings.join('、')
                    + '</span>（发布前请替换为体感表述）';
            }
            const a = await api('/api/articles/' + r.id);
            showDraft(a);
            USED.add(params.topic_obj || '');
            load();
        } else {
            st.textContent = '';
            showToast('❌ ' + ((r && r.error) || '生成失败'), 'error');
        }
    } catch (e) { st.textContent = ''; showToast('❌ ' + e.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = '✨ 生成文案'; }
}

async function saveDraft() {
    if (!DRAFT) return;
    const r = await api('/api/articles/' + DRAFT.id, {method: 'PUT',
        body: JSON.stringify({title: v('dr-title'), content_md: v('dr-body')})});
    showToast(r && r.ok ? '已保存' : '保存失败', r && r.ok ? 'success' : 'error');
    if (r && r.ok) load();
}

function copyDraftLink() {
    if (!DRAFT || !DRAFT.promo_link) { showToast('这篇没有推广链接', 'error'); return; }
    navigator.clipboard.writeText(DRAFT.promo_link)
        .then(() => showToast('✅ 已复制：' + DRAFT.promo_link, 'success'))
        .catch(() => prompt('推广链接：', DRAFT.promo_link));
}

async function rewriteDraft() {
    if (!DRAFT) return;
    showToast('⏳ 改写中…', 'success');
    const r = await api('/api/articles/' + DRAFT.id + '/rewrite', {method: 'POST',
        body: JSON.stringify({platform: v('dr-platform'), content_type: v('dr-type')})});
    if (r && r.ok) {
        showToast('✅ 改写完成（新篇，原篇保留）', 'success');
        showDraft(await api('/api/articles/' + r.id));
        load();
    } else {
        showToast('❌ ' + ((r && r.error) || '改写失败'), 'error');
    }
}

initLines().then(load);
</script>
{% endblock %}
